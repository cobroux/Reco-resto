<div
  class="cooking"
  data-testid="cooking"
  role="status"
  [attr.aria-hidden]="!waiting()"
  [style.--toss-ms]="tossMs + 'ms'"
>
  <div class="toss" aria-hidden="true">
    <span class="pan-shadow"></span>
    <svg class="steam s1" viewBox="0 0 12 34">
      <path d="M6 32 C1 26 11 20 6 14 C2 9 9 5 6 2" />
    </svg>
    <svg class="steam s2" viewBox="0 0 12 34">
      <path d="M6 32 C1 26 11 20 6 14 C2 9 9 5 6 2" />
    </svg>
    <svg class="steam s3" viewBox="0 0 12 34">
      <path d="M6 32 C1 26 11 20 6 14 C2 9 9 5 6 2" />
    </svg>
    <svg class="crepe" viewBox="0 0 60 16">
      <defs>
        <radialGradient id="crepe-gold" cx="40%" cy="40%" r="65%">
          <stop offset="0" stop-color="#fbe3a6" />
          <stop offset="0.6" stop-color="#eab65c" />
          <stop offset="1" stop-color="#c98630" />
        </radialGradient>
      </defs>
      <ellipse cx="30" cy="8" rx="28.5" ry="6.5" fill="url(#crepe-gold)" stroke="#c27d2e" />
      <g fill="#b06a22" opacity="0.5">
        <ellipse cx="19" cy="7" rx="3" ry="1.2" />
        <ellipse cx="34" cy="10" rx="2.4" ry="1" />
        <ellipse cx="42" cy="6" rx="1.8" ry="0.8" />
        <ellipse cx="27" cy="5" rx="1.4" ry="0.6" />
      </g>
    </svg>
    <svg class="pan" viewBox="0 0 130 44">
      <defs>
        <linearGradient id="pan-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a4363" />
          <stop offset="1" stop-color="#1f1b2e" />
        </linearGradient>
        <linearGradient id="pan-wood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d0925a" />
          <stop offset="1" stop-color="#9c5f2c" />
        </linearGradient>
      </defs>
      <path d="M6 12 H80 Q80 36 57 36 H29 Q6 36 6 12 Z" fill="url(#pan-body)" />
      <rect x="3" y="8.5" width="80" height="6" rx="3" fill="#5b5476" />
      <path d="M10 11.5 H76" stroke="#ffffff" stroke-opacity="0.18" stroke-linecap="round" />
      <rect x="80" y="14" width="12" height="6" rx="2" fill="#3a3450" />
      <circle cx="86" cy="17" r="1.4" fill="#9a94b3" />
      <rect x="90" y="12.5" width="38" height="9" rx="4.5" fill="url(#pan-wood)" />
      <circle cx="122" cy="17" r="1.6" fill="#7a4720" />
    </svg>
  </div>
  <p class="cooking-text">{{ texts.cooking }}</p>
</div>
