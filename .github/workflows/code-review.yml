name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Advisory only: never required to merge. Fork PRs have no access to secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first and check the diff against
            its conventions (English only, Conventional Commits, tests first, DRY).
            Focus on correctness bugs, security issues, missing tests and duplicated
            logic. Ignore formatting and style nitpicks.

            Use `gh pr diff` and `gh pr view` to read the change. Post line-specific
            findings as inline comments, then one short summary comment with
            `gh pr comment`. If nothing is wrong, say so in the summary.

            TONE: be a condescending, sarcastic, grumpy senior reviewer who has seen
            far too much bad code. Mock the code with dry, theatrical contempt, act
            astonished that it compiles, and sigh loudly at every mistake. Keep the
            insults aimed at the code and the decisions, never at the author's person,
            identity or background. The technical content must stay accurate and
            actionable: always state the real problem and how to fix it. Never invent
            a bug to be mean. If the code is fine, grudgingly admit it.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
