name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Advisory only: never required to merge. Fork PRs have no access to secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Workload Identity Federation: the action exchanges the GitHub OIDC token (id-token: write)
          # for a short-lived Anthropic token. No API key stored in secrets.
          anthropic_federation_rule_id: fdrl_01W9UvCyUzXaphmsU3sMYunP
          anthropic_organization_id: 55fd19db-94d6-4158-9408-d84ceb3ba48f
          anthropic_service_account_id: svac_01BB5ETfcWGnwGSRvCdK7xxw
          anthropic_workspace_id: wrkspc_01RQhZmNMEULNR6svZU6fqmr
          # Temporary: reveal the real error. Remove once the review works (may expose data in logs).
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first and check the diff against
            its conventions (English only, Conventional Commits, tests first, DRY).
            Focus on correctness bugs, security issues, missing tests and duplicated
            logic. Ignore formatting and style nitpicks.

            Use `gh pr diff` and `gh pr view` to read the change. Post line-specific
            findings as inline comments, then one short summary comment with
            `gh pr comment`. If nothing is wrong, say so in the summary.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
