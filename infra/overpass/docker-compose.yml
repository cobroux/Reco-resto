# Local Overpass API instance loaded with the France extract of OpenStreetMap (Geofabrik).
# Image and variables: https://github.com/wiktorn/Overpass-API (README, "init" mode).
# First start downloads about 5 GB and builds the database: it takes a long time and a lot of disk space
# (the README gives no figures; not measured yet). Next starts reuse the volume.
#
#   docker compose -f infra/overpass/docker-compose.yml up -d
#
# Endpoint for the backend: OVERPASS_BASE_URL=http://localhost:12346/api/interpreter
services:
  overpass:
    image: wiktorn/overpass-api
    container_name: reco-resto-overpass
    ports:
      - "12346:80"
    volumes:
      - overpass_db:/db
    environment:
      OVERPASS_MODE: init
      OVERPASS_PLANET_URL: https://download.geofabrik.de/europe/france/france-latest.osm.pbf
      OVERPASS_DIFF_URL: https://download.geofabrik.de/europe/france/updates/
      OVERPASS_UPDATE_SLEEP: "3600"
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_COMPRESSION: gz
      # The README converts a .pbf to .osm.bz2 with osmium before loading it.
      OVERPASS_PLANET_PREPROCESS: "mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf"
      # The README default stops the container once the database is built; keep it serving instead.
      OVERPASS_STOP_AFTER_INIT: "false"
    restart: unless-stopped

volumes:
  overpass_db:
